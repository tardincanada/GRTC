# Publica o Elementar no GitHub Releases, Modrinth e CurseForge.
# Como usar: aba "Actions" do repositorio > "Publish" > "Run workflow".
# A versao vem de mod_version em gradle.properties; as notas vem de CHANGELOG.md.
#
# Configuracao (Settings > Secrets and variables > Actions):
#   Secrets:   MODRINTH_TOKEN, CURSEFORGE_TOKEN
#   Variables: CURSEFORGE_ID; MODRINTH_ID is optional (the Modrinth ID is looked up from the
#              project slug "elementar"; set MODRINTH_ID to an ID or slug to override)
# Uma plataforma sem token e pulada, entao da para comecar so com o GitHub.
name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build and show what would be published (no upload)"
        type: boolean
        default: false

permissions:
  contents: write   # create the GitHub release and tag

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MINECRAFT_VERSION: 1.21.1
      JAVA_VERSION: 21
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Read version
        id: meta
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          case "$VERSION" in
            *alpha*) TYPE=alpha ;;
            *beta*|*rc*) TYPE=beta ;;
            *) TYPE=release ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Publishing Elementar $VERSION as $TYPE"

      - name: Find Modrinth project ID
        id: mr
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GIVEN: ${{ vars.MODRINTH_ID }}
          WANT: elementar
        run: |
          if [ -z "$TOKEN" ]; then echo "No MODRINTH_TOKEN: Modrinth skipped"; exit 0; fi
          UA="tardincanada/GRTC (GitHub Actions)"
          api() { curl -s -o /tmp/out.json -w '%{http_code}' -H "Authorization: $TOKEN" -H "User-Agent: $UA" "https://api.modrinth.com/v2/$1"; }
          ID=""
          for S in "$GIVEN" "$WANT"; do
            [ -z "$S" ] && continue
            CODE=$(api "project/$(printf %s "$S" | jq -sRr @uri)")
            echo "Lookup '$S': HTTP $CODE"
            [ "$CODE" = 200 ] && ID=$(jq -r '.id // empty' /tmp/out.json) && [ -n "$ID" ] && break
          done
          if [ -z "$ID" ]; then
            CODE=$(api user)
            if [ "$CODE" = 200 ]; then
              USER_ID=$(jq -r .id /tmp/out.json); echo "Token belongs to Modrinth user $(jq -r .username /tmp/out.json)"
              CODE=$(api "user/$USER_ID/projects")
              echo "Projects of this account (HTTP $CODE):"
              jq -r '.[] | "  \(.id)  slug=\(.slug)  title=\(.title)  type=\(.project_type)  status=\(.status)"' /tmp/out.json || cat /tmp/out.json
              ID=$(jq -r --arg w "$WANT" '[.[] | select(.slug == $w or (.title | ascii_downcase) == $w)] | .[0].id // empty' /tmp/out.json)
            else
              echo "Token cannot read the user (HTTP $CODE): $(cat /tmp/out.json)"
            fi
          fi
          if [ -z "$ID" ]; then
            echo "::error::Modrinth project not found (HTTP codes above: 401 = token wrong/expired or missing 'Read projects'; 404 = no project 'elementar'). Paste the ID shown under Settings of the project into the MODRINTH_ID variable."
            exit 1
          fi
          echo "Using Modrinth project ID: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build runGametest --stacktrace

      - name: Show files
        run: ls -l build/libs

      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: Elementar ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: CHANGELOG.md
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: fabric
          game-versions: ${{ env.MINECRAFT_VERSION }}
          java: ${{ env.JAVA_VERSION }}

          modrinth-id: ${{ steps.mr.outputs.id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-tag: v${{ steps.meta.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-prerelease: ${{ steps.meta.outputs.type != 'release' }}

          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            emi(optional){modrinth:fRiHVvU7}{curseforge:580555}
            jade(optional){modrinth:nvQzSEkH}{curseforge:324717}
            modmenu(optional){modrinth:mOgUt4GM}{curseforge:308702}
