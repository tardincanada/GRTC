# Compila o mod e roda os testes automaticos a cada push e pull request.
# Builds the mod and runs the game tests on every push and pull request.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Game tests
        run: ./gradlew runGametest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: elementar-jar
          path: build/libs/*.jar
